version: '3.9'
  
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    mem_limit: 256m
    mem_reservation: 256m
    container_name: api_service
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - ./.env
  
  filial_ms:
    build: 
      context: .
      dockerfile: Dockerfile.whatsapp
    mem_limit: 700m
    mem_reservation: 256m
    container_name: app_filial_ms
    environment:
      - USER_ID=filial-ms
      - API_ENDPOINT=http://api:3000/api/mensagens
      
    volumes:
      - ./sessions/filial-ms:/app/.wwebjs_auth
    shm_size: '1g'
    depends_on:
      - api

