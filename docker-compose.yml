version: "3.9"

x-env-vars: &env-vars
  LC_ALL:     "${LC_ALL:-C.UTF-8}"
  TZ:         "${TZ:-America/Sao_Paulo}"
  PGUSER:     "${PGUSER:-bi_script}"
  PGPASSWORD: "${PGPASSWORD}"           # defina em .env
  PGHOST:     "${PGHOST:-192.168.0.246}"
  PGDATABASE: "${PGDATABASE:-BI_COMERCIAL}"
  PGPORT:     "${PGPORT:-5432}"
  
x-whatsapp-env: &whatsapp-env
  <<: *env-vars
  NODE_ENV:                  "production"
  NODE_OPTIONS:              "--max-old-space-size=280"
  PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
  DISABLE_GPU:               "1"
  API_ENDPOINT:              "http://api:3000/api/mensagens"
  BATCH_SIZE:                "10"
  BATCH_INTERVAL:            "5000"
  PUPPETEER_DISABLE_PROFILE_LOCK: "true"
  # Chrome optimization flags
  CHROME_ARGS: "--no-sandbox --disable-dev-shm-usage --single-process --no-zygote --disable-gpu"

x-whatsapp-defaults: &whatsapp-defaults
  build:
    context: .
    dockerfile: Dockerfile.whatsapp
  mem_limit: 320m
  restart: unless-stopped  # Changed from "no" to allow restarts
  # Security options for Chrome
  security_opt:
    - seccomp:unconfined
  cap_add:
    - SYS_ADMIN
  # Shared memory for Chrome
  shm_size: 256m
  healthcheck:
    test: ["CMD", "node", "-e", "process.exit(process.memoryUsage().heapUsed > 280000000 ? 1 : 0)"]
    interval: 60s      # Increased interval to reduce load
    timeout: 10s       # Increased timeout
    retries: 3
    start_period: 60s  # Increased start period for WhatsApp initialization
  # Multiple tmpfs mounts for Chrome
  tmpfs:
    - /tmp:size=200m,exec
    - /var/tmp:size=100m,exec
    - /dev/shm:size=256m,exec
  # Additional environment for container isolation
  environment:
    DISPLAY: ":99"

x-api-defaults: &api-defaults
  build:
    context: .
    dockerfile: Dockerfile.api
  mem_limit: 512m
  restart: unless-stopped
  environment:
    <<: *env-vars
    NODE_ENV:           "production"
    NODE_OPTIONS:       "--max-old-space-size=384"
    MAX_BATCH_SIZE:     "25"
    
x-db-defaults: &db-defaults
  image: postgres:15-alpine
  mem_limit: 768m
  restart: unless-stopped
  environment:
    <<: *env-vars
    POSTGRES_USER:     "${PGUSER}"
    POSTGRES_PASSWORD: "${PGPASSWORD}"
    POSTGRES_DB:       "${PGDATABASE}"
  volumes:
    - pgdata:/var/lib/postgresql/data
    - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  # Banco de dados
  postgres:
    <<: *db-defaults
    container_name: whatsapp_db

  # API
  api:
    <<: *api-defaults
    container_name: whatsapp_api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Instâncias WhatsApp
  filial_ms:
    <<: *whatsapp-defaults
    container_name: app_filial_ms
    ports:
      - "3101:3000"
    environment:
      <<: *whatsapp-env
      USER_ID: "filial_ms"
    depends_on:
      - api
    volumes:
      - ./sessions/filial_ms:/app/.wwebjs_auth/session-filial_ms:rw
      - /tmp/chrome-filial_ms:/tmp/chrome-filial_ms:rw

