version: '3.9'

x-defaults: &defaults
  build: .
  mem_limit: 350m
  restart: unless-stopped
  environment:
    - NODE_ENV=production
    - NODE_OPTIONS=--max-old-space-size=300
    - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    - DISABLE_GPU=1
  healthcheck:
    test: ["CMD", "node", "-e", "process.exit(process.memoryUsage().heapUsed > 300000000 ? 1 : 0)"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  filial_ms:
    <<: *defaults
    container_name: app_filial_ms
    ports:
      - "3101:3000"
    environment:
      - USER_ID=filial-ms
      - API_ENDPOINT=http://api:3000/api/mensagens
    volumes:
      - ./sessions/filial-ms:/app/.wwebjs_auth/session-filial-ms

  filial_mt:
