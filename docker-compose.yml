version: '3.9'

x-whatsapp-defaults: &whatsapp-defaults
  build: 
    context: .
    dockerfile: Dockerfile.whatsapp
  mem_limit: 320m
  restart: unless-stopped
  environment:
    - NODE_ENV=production
    - NODE_OPTIONS=--max-old-space-size=280
    - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    - DISABLE_GPU=1
    - API_ENDPOINT=http://api:3000/api/mensagens
    - BATCH_SIZE=10
    - BATCH_INTERVAL=5000
  healthcheck:
    test: ["CMD", "node", "-e", "process.exit(process.memoryUsage().heapUsed > 280000000 ? 1 : 0)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # WhatsApp Client Services (15 instances)
  filial_ms:
    <<: *whatsapp-defaults
    container_name: app_filial_ms
    ports: ["3101:3000"]
    environment:
      - USER_ID=filial-ms
    volumes:
      - ./sessions/filial-ms:/app/.wwebjs_auth/session-filial-ms

  filial_mt:
    <<: *whatsapp-defaults
    container_name: app_filial_mt
    ports: ["3102:3000"]
    environment:
      - USER_ID=filial-mt
    volumes:
      - ./sessions/filial-mt:/app/.wwebjs_auth/session-filial-mt

  filial_pr:
    <<: *whatsapp-defaults
    container_name: app_filial_pr
    ports: ["3103:3000"]
    environment:
      - USER_ID=filial-pr
    volumes:
      - ./sessions/filial-pr:/app/.wwebjs_auth/session-filial-pr

  filial_go:
    <<: *whatsapp-defaults
    container_name: app_filial_go
    ports: ["3104:3000"]
    environment:
      - USER_ID=filial-go
    volumes:
      - ./sessions/filial-go:/app/.wwebjs_auth/session-filial-go

  vhf_sp:
    <<: *whatsapp-defaults
    container_name: app_vhf_sp
    ports: ["3105:3000"]
    environment:
      - USER_ID=vhf-sp
    volumes:
      - ./sessions/vhf-sp:/app/.wwebjs_auth/session-vhf-sp

  vans_sp:
    <<: *whatsapp-defaults
    container_name: app_vans_sp
    ports: ["3106:3000"]
    environment:
      - USER_ID=vans-sp
    volumes:
      - ./sessions/vans-sp:/app/.wwebjs_auth/session-vans-sp

  sudeste:
    <<: *whatsapp-defaults
    container_name: app_sudeste
    ports: ["3107:3000"]
    environment:
      - USER_ID=sudeste
    volumes:
      - ./sessions/sudeste:/app/.wwebjs_auth/session-sudeste

  sul:
    <<: *whatsapp-defaults
    container_name: app_sul
    ports: ["3108:3000"]
    environment:
      - USER_ID=sul
    volumes:
      - ./sessions/sul:/app/.wwebjs_auth/session-sul

  mg:
    <<: *whatsapp-defaults
    container_name: app_mg
    ports: ["3109:3000"]
    environment:
      - USER_ID=mg
    volumes:
      - ./sessions/mg:/app/.wwebjs_auth/session-mg

  norte:
    <<: *whatsapp-defaults
    container_name: app_norte
    ports: ["3110:3000"]
    environment:
      - USER_ID=norte
    volumes:
      - ./sessions/norte:/app/.wwebjs_auth/session-norte

  nordeste:
    <<: *whatsapp-defaults
    container_name: app_nordeste
    ports: ["3111:3000"]
    environment:
      - USER_ID=nordeste
    volumes:
      - ./sessions/nordeste:/app/.wwebjs_auth/session-nordeste

  projetos:
    <<: *whatsapp-defaults
    container_name: app_projetos
    ports: ["3112:3000"]
    environment:
      - USER_ID=projetos
    volumes:
      - ./sessions/projetos:/app/.wwebjs_auth/session-projetos

  comex1:
    <<: *whatsapp-defaults
    container_name: app_comex1
    ports: ["3113:3000"]
    environment:
      - USER_ID=comex1
    volumes:
      - ./sessions/comex1:/app/.wwebjs_auth/session-comex1

  comex2:
    <<: *whatsapp-defaults
    container_name: app_comex2
    ports: ["3114:3000"]
    environment:
      - USER_ID=comex2
    volumes:
      - ./sessions/comex2:/app/.wwebjs_auth/session-comex2

  comex3:
    <<: *whatsapp-defaults
    container_name: app_comex3
    ports: ["3115:3000"]
    environment:
      - USER_ID=comex3
    volumes:
      - ./sessions/comex3:/app/.wwebjs_auth/session-comex3

  # API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: whatsapp_api
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - PGUSER=${DB_USER:-postgres}
      - PGHOST=postgres
      - PGDATABASE=${DB_NAME:-whatsapp}
      - PGPASSWORD=${DB_PASSWORD:-postgres}
      - PGPORT=5432
      - MAX_BATCH_SIZE=25
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

  # PostgreSQL Service
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp_db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-whatsapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
