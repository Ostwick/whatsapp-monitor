version: '3.9'

# Shared environment variables
x-env: &env-vars
  L: "${L:-C.UTF-8}"
  TZ: "${TZ:-America/Sao_Paulo}"
  PGUSER: "${PGUSER:-bi_script}"
  PGPASSWORD: "${PGPASSWORD}"
  PGHOST: "${PGHOST:-192.168.0.246}"
  PGDATABASE: "${PGDATABASE:-BI_COMERCIAL}"
  PGPORT: "${PGPORT:-5432}"
  
# WhatsApp service defaults
x-whatsapp-defaults: &whatsapp-defaults
  build: 
    context: .
    dockerfile: Dockerfile.whatsapp
  mem_limit: 320m
  restart: unless-stopped
  environment:
    <<: *env-vars
    NODE_ENV: "production"
    NODE_OPTIONS: "--max-old-space-size=280"
    PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    DISABLE_GPU: "1"
    API_ENDPOINT: "http://api:3000/api/mensagens"
    BATCH_SIZE: "10"
    BATCH_INTERVAL: "5000"
    PUPPETEER_DISABLE_PROFILE_LOCK: "true"
  healthcheck:
    test: ["CMD", "node", "-e", "process.exit(process.memoryUsage().heapUsed > 280000000 ? 1 : 0)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  volumes:
    - type: tmpfs
      target: /tmp/chrome
      tmpfs:
        size: 100000000

# API service defaults
x-api-defaults: &api-defaults
  build:
    context: .
    dockerfile: ./backend/Dockerfile.api
  mem_limit: 512m
  restart: unless-stopped
  environment:
    <<: *env-vars
    NODE_ENV: "production"
    NODE_OPTIONS: "--max-old-space-size=384"
    MAX_BATCH_SIZE: "25"

# Database defaults
x-db-defaults: &db-defaults
  image: postgres:15-alpine
  mem_limit: 768m
  restart: unless-stopped
  environment:
    <<: *env-vars
    POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    POSTGRES_USER: ${DB_USER:-postgres}
    POSTGRES_DB: ${DB_NAME:-whatsapp}
  volumes:
    - pgdata:/var/lib/postgresql/data
    - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-whatsapp}"]
    interval: 5s
    timeout: 5s
    retries: 5

services:
  # Database Service
  postgres:
    <<: *db-defaults
    container_name: whatsapp_db

  # API Service
  api:
    <<: *api-defaults
    container_name: whatsapp_api
    ports: ["3000:3000"]

  # WhatsApp Client Services (15 instances)
  filial_ms:
    <<: *whatsapp-defaults
    container_name: app_filial_ms
    ports: ["3101:3000"]
    environment:
      - USER_ID=filial_ms
    volumes:
      - ./sessions/filial_ms:/app/.wwebjs_auth/session-filial-ms

  filial_mt:
    <<: *whatsapp-defaults
    container_name: app_filial_mt
    ports: ["3102:3000"]
