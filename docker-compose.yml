version: '3.9'
  
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    mem_limit: 256m
    mem_reservation: 256m
    container_name: api_service
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - whatsapp-net
  
  whatsapp_manager:
    build: 
      context: .
      dockerfile: Dockerfile.whatsapp 
    mem_limit: 12288m
    mem_reservation: 1024m

    restart: unless-stopped

    container_name: app_manager
    environment:
      - API_ENDPOINT=http://api:3000/api/mensagens
      
    volumes:
      - ./sessions:/app/.wwebjs_auth 
    shm_size: '4g'
    cap_add:
      - SYS_ADMIN
    depends_on:
      - api
    networks:
      - whatsapp-net

networks:
  whatsapp-net:
    driver: bridge
