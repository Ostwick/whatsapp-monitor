version: "3.9"

x-env-vars: &env-vars
  L:       "${L:-C.UTF-8}"
  TZ:      "${TZ:-America/Sao_Paulo}"
  PGUSER:     "${PGUSER:-bi_script}"
  PGPASSWORD: "${PGPASSWORD}"           # defina em .env
  PGHOST:     "${PGHOST:-192.168.0.246}"
  PGDATABASE: "${PGDATABASE:-BI_COMERCIAL}"
  PGPORT:     "${PGPORT:-5432}"
  
x-whatsapp-env: &whatsapp-env
  <<: *env-vars
  NODE_ENV:                  "production"
  NODE_OPTIONS:              "--max-old-space-size=280"
  PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
  DISABLE_GPU:               "1"
  API_ENDPOINT:              "http://api:3000/api/mensagens"
  BATCH_SIZE:                "10"
  BATCH_INTERVAL:            "5000"
  PUPPETEER_DISABLE_PROFILE_LOCK: "true"

x-whatsapp-defaults: &whatsapp-defaults
  build:
    context: .
    dockerfile: Dockerfile.whatsapp
  mem_limit: 320m
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "process.exit(process.memoryUsage().heapUsed > 280000000 ? 1 : 0)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  tmpfs:
    - /tmp/chrome:size=100000000

x-api-defaults: &api-defaults
  build:
    context: ./backend
    dockerfile: Dockerfile.api
  mem_limit: 512m
  restart: unless-stopped
  environment:
    <<: *env-vars
    NODE_ENV:           "production"
    NODE_OPTIONS:       "--max-old-space-size=384"
    MAX_BATCH_SIZE:     "25"
    
x-db-defaults: &db-defaults
  image: postgres:15-alpine
  mem_limit: 768m
  restart: unless-stopped
  environment:
    <<: *env-vars
    POSTGRES_USER:     "${PGUSER}"
    POSTGRES_PASSWORD: "${PGPASSWORD}"
    POSTGRES_DB:       "${PGDATABASE}"
  volumes:
    - pgdata:/var/lib/postgresql/data
    - ./backend/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
    interval: 5s
    timeout: 5s
    retries: 5


services:
  # Banco de dados
  postgres:
    <<: *db-defaults
    container_name: whatsapp_db

  # API
  api:
    <<: *api-defaults
    container_name: whatsapp_api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Instâncias WhatsApp
  filial_ms:
    <<: *whatsapp-defaults
    container_name: app_filial_ms
    ports:
      - "3101:3000"
    environment:
      <<: *whatsapp-env
      USER_ID: "filial_ms"
    depends_on:
